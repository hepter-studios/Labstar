<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="stylesheet" href="/brand-wordmark.css" />
    <link rel="stylesheet" href="/brand-wordmark-star-tuning.css" />
    <link rel="stylesheet" href="/access-login-modern.css" />
    <link rel="stylesheet" href="/access-state-cleanup.css" />
    <link rel="stylesheet" href="/organization-entry-neumorphism.css" />
    <link rel="stylesheet" href="/organization-management.css" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Labstar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#010207" />
    <meta name="description" content="Labstar — organização privada de empresas, projetos e equipes." />
    <script>
      (() => {
        let theme = "light";
        try {
          const saved = JSON.parse(localStorage.getItem("labstar-app-settings-v1") || "null");
          if (saved?.themeMode === "dark") theme = "dark";
        } catch {
          // Preferências corrompidas voltam ao tema inicial seguro.
        }
        document.documentElement.dataset.labstarTheme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      html:not([data-labstar-boot="ready"]),
      html:not([data-labstar-boot="ready"]) body,
      html:not([data-labstar-boot="ready"]) #root,
      html:not([data-labstar-boot="ready"]) #root > main {
        background-color: #010207;
        background-image:
          radial-gradient(circle at 12% 18%, rgba(255,255,255,.72) 0 .55px, transparent .95px),
          radial-gradient(circle at 78% 16%, rgba(128,165,255,.58) 0 .65px, transparent 1.05px),
          radial-gradient(circle at 32% 72%, rgba(255,255,255,.46) 0 .5px, transparent .9px),
          radial-gradient(circle at 86% 72%, rgba(255,255,255,.62) 0 .55px, transparent .95px);
        background-size: 137px 147px, 193px 181px, 223px 211px, 277px 263px;
        color: #f7f9ff;
      }
    </style>
    <title>Labstar</title>
  </head>
  <body style="margin:0">
    <div id="root">
      <main style="min-height:100vh"></main>
    </div>
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/mobile-final-entry.ts"></script>
  </body>
</html>
