name: Vigiar e recuperar backend Rust

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labstar-rust-backend-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Saúde Web/Desktop e recuperação automática
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      API_URL: https://labstar-api-mackson.fly.dev
      WEB_ORIGIN: https://labstar.pages.dev
      TAURI_ORIGIN: http://tauri.localhost

    steps:
      - name: Verificar saúde atual
        id: probe
        shell: bash
        run: |
          set +e
          rm -f live.json ready.json

          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 45 \
            "$API_URL/health/live" > live.json
          live_status=$?

          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 45 \
            "$API_URL/health/ready" > ready.json
          ready_status=$?

          if [ "$live_status" -eq 0 ] \
            && grep -q '"status":"ok"' live.json \
            && [ "$ready_status" -eq 0 ] \
            && grep -q '"status":"ready"' ready.json; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "A API Rust está saudável."
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "A API Rust não respondeu corretamente; a recuperação será iniciada."
          fi

      - name: Baixar backend estável
        if: steps.probe.outputs.healthy != 'true'
        uses: actions/checkout@v4
        with:
          ref: feat/rust-backend-clean

      - name: Instalar flyctl
        if: steps.probe.outputs.healthy != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Republicar e reiniciar a API Rust
        if: steps.probe.outputs.healthy != 'true'
        shell: bash
        run: >-
          flyctl deploy
          --app labstar-api-mackson
          --config backend/fly.toml
          --dockerfile backend/Dockerfile
          --remote-only
          --ha=false
          --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Confirmar recuperação completa
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 60 \
            "$API_URL/health/live" | tee live-final.json
          grep -q '"status":"ok"' live-final.json

          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 60 \
            "$API_URL/health/ready" | tee ready-final.json
          grep -q '"status":"ready"' ready-final.json

      - name: Confirmar acesso do site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 60 \
            --dump-header web-headers.txt \
            --output /dev/null \
            --request OPTIONS \
            --header "Origin: $WEB_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: authorization,content-type" \
            "$API_URL/v1/invites"

          tr -d '\r' < web-headers.txt > web-headers-normalized.txt
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://labstar\.pages\.dev[[:space:]]*$' web-headers-normalized.txt
          grep -Eiq '^access-control-allow-methods:.*POST' web-headers-normalized.txt
          grep -Eiq '^access-control-allow-headers:.*authorization' web-headers-normalized.txt

      - name: Confirmar acesso do aplicativo desktop
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 60 \
            --dump-header tauri-headers.txt \
            --output /dev/null \
            --request OPTIONS \
            --header "Origin: $TAURI_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: authorization,content-type" \
            "$API_URL/v1/invites"

          tr -d '\r' < tauri-headers.txt > tauri-headers-normalized.txt
          grep -Eiq '^access-control-allow-origin:[[:space:]]*http://tauri\.localhost[[:space:]]*$' tauri-headers-normalized.txt
          grep -Eiq '^access-control-allow-methods:.*POST' tauri-headers-normalized.txt
          grep -Eiq '^access-control-allow-headers:.*authorization' tauri-headers-normalized.txt

      - name: Mostrar diagnóstico da Fly.io em caso de falha
        if: failure()
        shell: bash
        run: |
          flyctl status --app labstar-api-mackson --all || true
          flyctl checks list --app labstar-api-mackson || true
          flyctl logs --app labstar-api-mackson --no-tail || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
