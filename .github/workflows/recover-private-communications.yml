name: Ativar comunicações privadas seguras

on:
  push:
    branches:
      - main
    paths:
      - "supabase/labstar-supabase-v9-compatibility.sql"
      - "supabase/labstar-supabase-v9-direct-messages.sql"
      - "supabase/labstar-supabase-v13-private-calls.sql"
      - "supabase/labstar-supabase-v14-private-communications-hardening.sql"
      - "supabase/labstar-supabase-v14-private-communications-audit.sql"
      - ".github/workflows/recover-private-communications.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labstar-private-communications-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Backup, migração e auditoria
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar código oficial
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validar conexão protegida
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DATABASE_URL:-}" ]; then
            echo "O secret SUPABASE_DATABASE_URL não está configurado."
            exit 1
          fi

      - name: Preparar PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17-bookworm
          docker run --rm postgres:17-bookworm psql --version

      - name: Gerar backup antes das comunicações privadas
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -e BACKUP_TIMESTAMP="${timestamp}" \
            -v "${PWD}/backup:/backup" \
            postgres:17-bookworm \
            bash -euo pipefail -c '
              pg_dump \
                --dbname="${SUPABASE_DATABASE_URL}" \
                --format=custom \
                --no-owner \
                --no-privileges \
                --file="/backup/labstar-before-private-communications-${BACKUP_TIMESTAMP}.dump"
            '
          sha256sum backup/*.dump > backup/SHA256SUMS.txt

      - name: Preparar compatibilidade com mensagens antigas
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" \
              --set ON_ERROR_STOP=1 \
              --file /workspace/supabase/labstar-supabase-v9-compatibility.sql

      - name: Ativar mensagens diretas privadas
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" \
              --set ON_ERROR_STOP=1 \
              --file /workspace/supabase/labstar-supabase-v9-direct-messages.sql

      - name: Ativar chamadas privadas
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" \
              --set ON_ERROR_STOP=1 \
              --file /workspace/supabase/labstar-supabase-v13-private-calls.sql

      - name: Endurecer privilégios e bloquear estruturas legadas
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" \
              --set ON_ERROR_STOP=1 \
              --file /workspace/supabase/labstar-supabase-v14-private-communications-hardening.sql

      - name: Auditar estrutura, RLS, RPCs, arquivos e Realtime
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" \
              --set ON_ERROR_STOP=1 \
              --file /workspace/supabase/labstar-supabase-v14-private-communications-audit.sql \
              | tee private-communications-audit.txt
          grep -Fq 'Auditoria das comunicações privadas aprovada.' private-communications-audit.txt

      - name: Registrar recuperação confirmada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p docs/runtime
          cat > docs/runtime/private-communications-recovered.txt <<EOF
          Labstar private communications confirmed
          compatibility_migration=labstar-supabase-v9-compatibility.sql
          direct_messages_migration=labstar-supabase-v9-direct-messages.sql
          private_calls_migration=labstar-supabase-v13-private-calls.sql
          hardening_migration=labstar-supabase-v14-private-communications-hardening.sql
          audit=labstar-supabase-v14-private-communications-audit.sql
          source_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git add docs/runtime/private-communications-recovered.txt
          git commit -m "Confirma comunicações privadas no Supabase" || exit 0
          git push origin HEAD:main

      - name: Guardar backup e relatório privado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labstar-before-private-communications-${{ github.run_number }}
          path: |
            backup/
            private-communications-audit.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
