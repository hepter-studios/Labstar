name: Ativar comunicações privadas seguras

on:
  push:
    branches:
      - main
    paths:
      - "supabase/labstar-supabase-v9-direct-messages.sql"
      - "supabase/labstar-supabase-v13-private-calls.sql"
      - ".github/workflows/recover-private-communications.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labstar-private-communications-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Backup, migração e auditoria
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar código oficial
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validar conexão protegida
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DATABASE_URL:-}" ]; then
            echo "O secret SUPABASE_DATABASE_URL não está configurado."
            exit 1
          fi

      - name: Preparar PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17-bookworm
          docker run --rm postgres:17-bookworm psql --version

      - name: Gerar backup antes das comunicações privadas
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -e BACKUP_TIMESTAMP="${timestamp}" \
            -v "${PWD}/backup:/backup" \
            postgres:17-bookworm \
            bash -euo pipefail -c '
              pg_dump \
                --dbname="${SUPABASE_DATABASE_URL}" \
                --format=custom \
                --no-owner \
                --no-privileges \
                --file="/backup/labstar-before-private-communications-${BACKUP_TIMESTAMP}.dump"
            '
          sha256sum backup/*.dump > backup/SHA256SUMS.txt

      - name: Ativar mensagens diretas privadas
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" \
              --set ON_ERROR_STOP=1 \
              --file /workspace/supabase/labstar-supabase-v9-direct-messages.sql

      - name: Ativar chamadas privadas
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" \
              --set ON_ERROR_STOP=1 \
              --file /workspace/supabase/labstar-supabase-v13-private-calls.sql

      - name: Auditar estrutura e permissões finais
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" \
              --set ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command "
                select
                  to_regclass('public.direct_threads') is not null
                  and to_regclass('public.direct_thread_members') is not null
                  and to_regclass('public.direct_messages') is not null
                  and to_regclass('public.direct_message_attachments') is not null
                  and to_regclass('public.direct_call_sessions') is not null
                  and to_regclass('public.direct_call_signals') is not null
                  and has_function_privilege('authenticated', 'public.get_or_create_direct_thread(uuid)', 'EXECUTE')
                  and has_function_privilege('authenticated', 'public.list_direct_threads()', 'EXECUTE')
                  and has_function_privilege('authenticated', 'public.mark_direct_thread_read(uuid)', 'EXECUTE')
                  and has_function_privilege('authenticated', 'public.create_direct_call(uuid,uuid,text)', 'EXECUTE')
                  and has_function_privilege('authenticated', 'public.set_direct_call_status(uuid,text)', 'EXECUTE')
                  and has_function_privilege('authenticated', 'public.send_direct_call_signal(uuid,uuid,text,jsonb)', 'EXECUTE')
                  and has_table_privilege('authenticated', 'public.direct_messages', 'SELECT')
                  and has_table_privilege('authenticated', 'public.direct_messages', 'INSERT')
                  and has_table_privilege('authenticated', 'public.direct_call_sessions', 'SELECT')
                  and not has_table_privilege('authenticated', 'public.direct_call_sessions', 'INSERT')
                  and not has_table_privilege('authenticated', 'public.direct_call_sessions', 'UPDATE')
                  and not has_table_privilege('anon', 'public.direct_messages', 'SELECT')
                  and not has_table_privilege('anon', 'public.direct_call_sessions', 'SELECT')
                  and (
                    select bool_and(relrowsecurity)
                    from pg_class
                    where oid in (
                      'public.direct_threads'::regclass,
                      'public.direct_thread_members'::regclass,
                      'public.direct_messages'::regclass,
                      'public.direct_message_attachments'::regclass,
                      'public.direct_call_sessions'::regclass,
                      'public.direct_call_signals'::regclass
                    )
                  );
              " | tee private-communications-check.txt
          grep -qx 't' private-communications-check.txt

      - name: Registrar recuperação confirmada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p docs/runtime
          cat > docs/runtime/private-communications-recovered.txt <<EOF
          Labstar private communications confirmed
          direct_messages_migration=labstar-supabase-v9-direct-messages.sql
          private_calls_migration=labstar-supabase-v13-private-calls.sql
          source_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git add docs/runtime/private-communications-recovered.txt
          git commit -m "Confirma comunicações privadas no Supabase" || exit 0
          git push origin HEAD:main

      - name: Guardar backup privado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labstar-before-private-communications-${{ github.run_number }}
          path: backup/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
