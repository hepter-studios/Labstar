name: Confirmar teste real do backend Rust

on:
  workflow_run:
    workflows:
      - Testar backend Rust com duas contas
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: confirm-labstar-rust-e2e
  cancel-in-progress: true

jobs:
  confirm:
    name: Registrar E2E aprovado
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feat/backend-rust-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar branch testada
        uses: actions/checkout@v4
        with:
          ref: feat/backend-rust-complete
          fetch-depth: 0

      - name: Registrar confirmação
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p docs/runtime
          cat > docs/runtime/rust-e2e-confirmed.txt <<EOF
          Labstar Rust end-to-end test confirmed
          source_sha=$SOURCE_SHA
          workflow_run=$SOURCE_RUN
          tested=oauth,postgresql,presence,direct_messages,private_calls
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime/rust-e2e-confirmed.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Confirma teste real do backend Rust"
          git push origin HEAD:feat/backend-rust-complete
