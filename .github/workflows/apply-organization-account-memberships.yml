name: Ativar organizações por conta

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260811001800_organization_account_memberships.sql"
      - ".github/workflows/apply-organization-account-memberships.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labstar-organization-account-memberships
  cancel-in-progress: false

jobs:
  migrate:
    name: Backup, migração e auditoria
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar código oficial
        uses: actions/checkout@v4

      - name: Validar conexão protegida
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DATABASE_URL:-}" ]; then
            echo "O secret SUPABASE_DATABASE_URL não está configurado."
            exit 1
          fi

      - name: Preparar PostgreSQL 17
        run: |
          docker pull postgres:17-bookworm
          docker run --rm postgres:17-bookworm psql --version

      - name: Backup antes da migração
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -e BACKUP_TIMESTAMP="${timestamp}" \
            -v "${PWD}/backup:/backup" \
            postgres:17-bookworm \
            bash -euo pipefail -c '
              pg_dump --dbname="${SUPABASE_DATABASE_URL}" --format=custom --no-owner --no-privileges --file="/backup/labstar-before-organization-accounts-${BACKUP_TIMESTAMP}.dump"
            '
          sha256sum backup/*.dump > backup/SHA256SUMS.txt

      - name: Confirmar fundação anterior
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" --set ON_ERROR_STOP=1 --tuples-only --no-align --command "
              select
                to_regclass('public.organizations') is not null
                and to_regclass('public.organization_members') is not null;
            " | tee foundation-ready.txt
          grep -qx 't' foundation-ready.txt

      - name: Aplicar vínculo de organizações por conta
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" --set ON_ERROR_STOP=1 --file /workspace/supabase/migrations/20260811001800_organization_account_memberships.sql

      - name: Auditar isolamento de identidade e organização
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" --set ON_ERROR_STOP=1 --tuples-only --no-align --command "
              select
                to_regclass('public.organization_accounts') is not null
                and to_regprocedure('public.list_my_organizations()') is not null
                and to_regprocedure('public.create_organization(text,text)') is not null
                and to_regprocedure('public.current_account_is_in_organization(uuid)') is not null
                and exists (
                  select 1
                  from public.organizations
                  where id='00000000-0000-4000-8000-000000000001'::uuid
                    and is_primary_legacy
                );
            " | tee organization-accounts-audit.txt
          grep -qx 't' organization-accounts-audit.txt

      - name: Guardar backup privado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labstar-before-organization-accounts-${{ github.run_number }}
          path: |
            backup/
            foundation-ready.txt
            organization-accounts-audit.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
