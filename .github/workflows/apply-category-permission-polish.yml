name: Ativar categorias privadas e permissões consistentes

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260809223000_category_permissions_consistency.sql"
      - ".github/workflows/apply-category-permission-polish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labstar-category-permission-polish
  cancel-in-progress: false

jobs:
  migrate:
    name: Backup, migração e auditoria
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar código oficial
        uses: actions/checkout@v4

      - name: Validar conexão protegida
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DATABASE_URL:-}" ]; then
            echo "O secret SUPABASE_DATABASE_URL não está configurado."
            exit 1
          fi

      - name: Preparar PostgreSQL 17
        run: |
          docker pull postgres:17-bookworm
          docker run --rm postgres:17-bookworm psql --version

      - name: Backup antes da migração
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -e BACKUP_TIMESTAMP="${timestamp}" \
            -v "${PWD}/backup:/backup" \
            postgres:17-bookworm \
            bash -euo pipefail -c '
              pg_dump --dbname="${SUPABASE_DATABASE_URL}" --format=custom --no-owner --no-privileges --file="/backup/labstar-before-category-permissions-${BACKUP_TIMESTAMP}.dump"
            '
          sha256sum backup/*.dump > backup/SHA256SUMS.txt

      - name: Aplicar categorias e permissões
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" --set ON_ERROR_STOP=1 --file /workspace/supabase/migrations/20260809223000_category_permissions_consistency.sql

      - name: Auditar contratos finais
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" --set ON_ERROR_STOP=1 --tuples-only --no-align --command "
              select
                exists (select 1 from information_schema.columns where table_schema='public' and table_name='channel_categories' and column_name='is_private')
                and exists (select 1 from information_schema.columns where table_schema='public' and table_name='channel_categories' and column_name='read_only')
                and exists (select 1 from information_schema.columns where table_schema='public' and table_name='channel_categories' and column_name='allowed_job_roles')
                and exists (select 1 from information_schema.columns where table_schema='public' and table_name='channels' and column_name='inherit_category_access')
                and has_function_privilege('authenticated', 'public.member_can_access_labstar_category(uuid)', 'EXECUTE')
                and has_function_privilege('authenticated', 'public.member_can_post_labstar_category(uuid)', 'EXECUTE')
                and has_function_privilege('authenticated', 'public.can_manage_labstar_members()', 'EXECUTE')
                and has_function_privilege('authenticated', 'public.can_manage_professional_roles()', 'EXECUTE')
                and (select relrowsecurity from pg_class where oid='public.channel_categories'::regclass);
            " | tee category-permission-audit.txt
          grep -qx 't' category-permission-audit.txt

      - name: Guardar backup privado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labstar-before-category-permissions-${{ github.run_number }}
          path: |
            backup/
            category-permission-audit.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
