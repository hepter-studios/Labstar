name: Corrigir manifesto Tauri 11.3.0

on:
  push:
    branches:
      - feat/backend-rust-complete
    paths:
      - src-tauri/Cargo.toml
      - .github/workflows/repair-tauri-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-tauri-manifest-11-3-0
  cancel-in-progress: true

jobs:
  repair:
    name: Corrigir e validar Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: feat/backend-rust-complete
          fetch-depth: 0

      - name: Corrigir nome da dependência Tauri
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^ta uri =/tauri =/' src-tauri/Cargo.toml
          grep -q '^tauri = ' src-tauri/Cargo.toml

      - name: Registrar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Corrige manifesto Tauri 11.3.0"
          git push origin HEAD:feat/backend-rust-complete
