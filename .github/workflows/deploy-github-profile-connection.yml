name: Publicar conexão GitHub do perfil

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DEPLOY_GITHUB_PROFILE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: labstar-github-profile-function
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'DEPLOY_GITHUB_PROFILE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pgzwyngxsxnheulvusdq
      LABSTAR_GH_PROFILE_CLIENT_ID: ${{ secrets.LABSTAR_GH_PROFILE_CLIENT_ID }}
      LABSTAR_GH_PROFILE_CLIENT_SECRET: ${{ secrets.LABSTAR_GH_PROFILE_CLIENT_SECRET }}
      GITHUB_PROFILE_CALLBACK_URL: https://pgzwyngxsxnheulvusdq.supabase.co/functions/v1/github-profile-connection
      LABSTAR_PROFILE_ALLOWED_ORIGINS: https://labstar.pages.dev
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar segredos
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN ausente"; exit 1; }
          test -n "${LABSTAR_GH_PROFILE_CLIENT_ID:-}" || { echo "LABSTAR_GH_PROFILE_CLIENT_ID ausente"; exit 1; }
          test -n "${LABSTAR_GH_PROFILE_CLIENT_SECRET:-}" || { echo "LABSTAR_GH_PROFILE_CLIENT_SECRET ausente"; exit 1; }
          test -f supabase/functions/github-profile-connection/index.ts

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Publicar segredos da função
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            GITHUB_PROFILE_CLIENT_ID="$LABSTAR_GH_PROFILE_CLIENT_ID" \
            GITHUB_PROFILE_CLIENT_SECRET="$LABSTAR_GH_PROFILE_CLIENT_SECRET" \
            GITHUB_PROFILE_CALLBACK_URL="$GITHUB_PROFILE_CALLBACK_URL" \
            LABSTAR_PROFILE_ALLOWED_ORIGINS="$LABSTAR_PROFILE_ALLOWED_ORIGINS" \
            --project-ref "$PROJECT_REF"

      - name: Publicar função OAuth
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy github-profile-connection \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
