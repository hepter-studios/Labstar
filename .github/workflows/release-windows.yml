name: Publicar Labstar Windows 11.2.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "scripts/load-production-env.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-windows.yml"

permissions:
  contents: write

concurrency:
  group: labstar-windows-release-11-2-7
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (EXE + MSI)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      VITE_SUPABASE_URL: https://pgzwyngxsxnheulvusdq.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Baixar código oficial
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar configuração pública com o site
        run: node scripts/load-production-env.mjs

      - name: Validar frontend
        run: npm run build

      - name: Compilar Tauri 2
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Organizar instaladores
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $nsis = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          $msi = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' -File | Select-Object -First 1
          if (-not $nsis) { throw 'Instalador EXE não encontrado.' }
          if (-not $msi) { throw 'Instalador MSI não encontrado.' }
          Copy-Item $nsis.FullName 'artifacts/Labstar_11.2.7_x64-setup.exe' -Force
          Copy-Item $msi.FullName 'artifacts/Labstar_11.2.7_x64.msi' -Force
          $exeHash = (Get-FileHash 'artifacts/Labstar_11.2.7_x64-setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $msiHash = (Get-FileHash 'artifacts/Labstar_11.2.7_x64.msi' -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          Labstar 11.2.7
          source_sha=${{ github.sha }}
          exe_sha256=$exeHash
          msi_sha256=$msiHash
          generated_at=$(Get-Date -AsUTC -Format o)
          "@ | Set-Content -Encoding utf8 'artifacts/build-info.txt'

      - name: Guardar artefatos da execução
        uses: actions/upload-artifact@v4
        with:
          name: labstar-windows-11.2.7-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar download oficial
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v11.2.7
          name: Labstar 11.2.7
          body: |
            Versão oficial do Labstar para Windows sem dependência da Fly.io.
            Identidade e convites usam funções protegidas do Supabase; o núcleo
            Tauri 2/Rust continua responsável por recursos nativos, deep links,
            configurações locais e segurança da aplicação instalada.
          draft: false
          prerelease: false
          files: |
            artifacts/Labstar_11.2.7_x64-setup.exe
            artifacts/Labstar_11.2.7_x64.msi
            artifacts/build-info.txt
