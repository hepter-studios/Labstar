name: Build Labstar Windows

on:
  workflow_dispatch:
    inputs:
      upload_release_assets:
        description: "Publicar também em uma GitHub Release existente/criada por tag"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: labstar-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run build

      - name: Build Tauri Windows
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2 build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Collect installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $nsis = Get-ChildItem -Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          $msi = Get-ChildItem -Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' -File | Select-Object -First 1

          if (-not $nsis) { throw 'Instalador NSIS não encontrado.' }
          if (-not $msi) { throw 'Instalador MSI não encontrado.' }

          Copy-Item $nsis.FullName 'artifacts/Labstar_11.0.0_x64-setup.exe'
          Copy-Item $msi.FullName 'artifacts/Labstar_11.0.0_x64.msi'

          $exeHash = (Get-FileHash 'artifacts/Labstar_11.0.0_x64-setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $msiHash = (Get-FileHash 'artifacts/Labstar_11.0.0_x64.msi' -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          Labstar 11.0.0
          source_sha=${{ github.sha }}
          target=x86_64-pc-windows-msvc
          exe_sha256=$exeHash
          msi_sha256=$msiHash
          generated_at=$(Get-Date -AsUTC -Format o)
          "@ | Set-Content -Encoding utf8 'artifacts/build-info.txt'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labstar-windows-x64-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.upload_release_assets == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/Labstar_11.0.0_x64-setup.exe
            artifacts/Labstar_11.0.0_x64.msi
            artifacts/build-info.txt
          generate_release_notes: true
