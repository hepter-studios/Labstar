name: Validar Tauri e Rust

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Web + Rust no Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências web
        run: npm ci

      - name: Validar build web
        run: npm run build

      - name: Instalar Rust estável
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Restaurar cache do Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Resolver dependências nativas
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Verificar formatação Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Executar Clippy sem avisos
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Executar testes Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
