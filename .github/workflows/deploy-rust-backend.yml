name: Publicar backend Rust

on:
  push:
    branches:
      - feat/backend-rust-complete
    paths:
      - "backend/**"
      - ".github/workflows/deploy-rust-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-labstar-rust-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar, publicar e auditar API Rust
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      API_URL: https://labstar-api-mackson.fly.dev
      WEB_ORIGIN: https://labstar.pages.dev
      TAURI_ORIGIN: http://tauri.localhost
      UNTRUSTED_ORIGIN: http://example.com
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY_SECRET: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Validar backend sem avisos
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --locked

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Confirmar credencial da Fly.io
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl auth whoami >/dev/null

      - name: Sincronizar segredos disponíveis
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$DATABASE_URL_SECRET" ]; then args+=("DATABASE_URL=$DATABASE_URL_SECRET"); fi
          if [ -n "$SUPABASE_URL_SECRET" ]; then args+=("SUPABASE_URL=$SUPABASE_URL_SECRET"); fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY_SECRET" ]; then args+=("SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY_SECRET"); fi
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY_SECRET" ]; then args+=("SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY_SECRET"); fi
          if [ ${#args[@]} -gt 0 ]; then
            flyctl secrets set --app labstar-api-mackson --stage "${args[@]}"
          fi

      - name: Publicar contêiner Rust
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy . \
            --app labstar-api-mackson \
            --config backend/fly.toml \
            --dockerfile backend/Dockerfile \
            --remote-only \
            --ha=false \
            --wait-timeout 12m

      - name: Confirmar saúde e runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 60 \
            "$API_URL/health/live" | tee live.json
          grep -q '"status":"ok"' live.json
          grep -q '"runtime":"rust"' live.json

          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 60 \
            "$API_URL/health/ready" | tee ready.json
          grep -q '"status":"ready"' ready.json
          grep -q '"database":"postgresql"' ready.json
          grep -q '"realtime":"rust-websocket"' ready.json

      - name: Auditar CORS da Web e do desktop
        shell: bash
        run: |
          set -euo pipefail
          check_origin() {
            local origin="$1"
            local file="$2"
            curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 20 --max-time 60 \
              --dump-header "$file" --output /dev/null \
              --request OPTIONS \
              --header "Origin: $origin" \
              --header "Access-Control-Request-Method: GET" \
              --header "Access-Control-Request-Headers: authorization,content-type" \
              "$API_URL/v1/me"
            tr -d '\r' < "$file" > "$file.normalized"
            grep -Fqi "access-control-allow-origin: $origin" "$file.normalized"
            grep -Eiq '^access-control-allow-headers:.*authorization' "$file.normalized"
          }
          check_origin "$WEB_ORIGIN" web-headers.txt
          check_origin "$TAURI_ORIGIN" tauri-headers.txt

      - name: Confirmar bloqueio de origem não confiável
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --connect-timeout 20 --max-time 60 \
            --dump-header untrusted.txt --output /dev/null \
            --request OPTIONS \
            --header "Origin: $UNTRUSTED_ORIGIN" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: authorization,content-type" \
            "$API_URL/v1/me"
          tr -d '\r' < untrusted.txt > untrusted.normalized
          if grep -Fqi "access-control-allow-origin: $UNTRUSTED_ORIGIN" untrusted.normalized; then
            echo "Origem não confiável foi autorizada."
            exit 1
          fi

      - name: Diagnóstico da Fly.io
        if: always()
        shell: bash
        run: |
          flyctl status --app labstar-api-mackson --all || true
          flyctl checks list --app labstar-api-mackson || true
          flyctl logs --app labstar-api-mackson --no-tail || true
