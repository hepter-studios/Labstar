name: Validar backend Rust

on:
  push:
    branches:
      - main
      - "feat/rust-backend-clean"
    paths:
      - "backend/**"
      - ".github/workflows/rust-backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/rust-backend-check.yml"

permissions:
  contents: write

concurrency:
  group: rust-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Backend Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Rust estável
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Restaurar cache do Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: backend-cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.toml', 'backend/Cargo.lock') }}
          restore-keys: |
            backend-cargo-${{ runner.os }}-

      - name: Atualizar dependências travadas
        run: cargo generate-lockfile --manifest-path backend/Cargo.toml

      - name: Verificar formatação
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Executar Clippy sem avisos
        run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Executar testes
        run: cargo test --locked --manifest-path backend/Cargo.toml --all-features

      - name: Versionar Cargo.lock validado
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/rust-backend-clean'
        shell: bash
        run: |
          if ! git diff --quiet -- backend/Cargo.lock || [ -n "$(git status --porcelain -- backend/Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/Cargo.lock
            git commit -m "Atualiza dependências dos convites Rust"
            git push origin HEAD:feat/rust-backend-clean
          fi
