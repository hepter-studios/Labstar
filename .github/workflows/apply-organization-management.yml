name: Ativar gestão de organizações

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260811010000_organization_management.sql"
      - ".github/workflows/apply-organization-management.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labstar-organization-management
  cancel-in-progress: false

jobs:
  migrate:
    name: Backup, migração e auditoria
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar código oficial
        uses: actions/checkout@v4

      - name: Validar conexão protegida
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DATABASE_URL:-}" ]; then
            echo "O secret SUPABASE_DATABASE_URL não está configurado."
            exit 1
          fi

      - name: Preparar PostgreSQL 17
        run: |
          docker pull postgres:17-bookworm
          docker run --rm postgres:17-bookworm psql --version

      - name: Backup antes da migração
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -e BACKUP_TIMESTAMP="${timestamp}" \
            -v "${PWD}/backup:/backup" \
            postgres:17-bookworm \
            bash -euo pipefail -c '
              pg_dump --dbname="${SUPABASE_DATABASE_URL}" --format=custom --no-owner --no-privileges --file="/backup/labstar-before-organization-management-${BACKUP_TIMESTAMP}.dump"
            '
          sha256sum backup/*.dump > backup/SHA256SUMS.txt

      - name: Confirmar fundação multi-organização
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" --set ON_ERROR_STOP=1 --tuples-only --no-align --command "
              select
                to_regclass('public.organizations') is not null
                and to_regclass('public.organization_accounts') is not null
                and to_regprocedure('public.current_account_organization_role(uuid)') is not null;
            " | tee foundation-ready.txt
          grep -qx 't' foundation-ready.txt

      - name: Aplicar gestão de organizações
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            -v "${PWD}:/workspace:ro" \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" --set ON_ERROR_STOP=1 --file /workspace/supabase/migrations/20260811010000_organization_management.sql

      - name: Auditar funções de gestão
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e SUPABASE_DATABASE_URL \
            -e PGSSLMODE=require \
            postgres:17-bookworm \
            psql "${SUPABASE_DATABASE_URL}" --set ON_ERROR_STOP=1 --tuples-only --no-align --command "
              select
                to_regprocedure('public.update_organization_profile(uuid,text,text)') is not null
                and to_regprocedure('public.list_organization_accounts(uuid)') is not null
                and to_regprocedure('public.set_organization_account_role(uuid,uuid,text)') is not null
                and to_regprocedure('public.delete_organization(uuid,text)') is not null;
            " | tee organization-management-audit.txt
          grep -qx 't' organization-management-audit.txt

      - name: Guardar backup privado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labstar-before-organization-management-${{ github.run_number }}
          path: |
            backup/
            foundation-ready.txt
            organization-management-audit.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
