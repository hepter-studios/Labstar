name: Publicar API administrativa Rust na Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-rust-backend-fly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rust-backend-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validar e publicar API Rust
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      API_URL: https://labstar-api-mackson.fly.dev
      WEB_ORIGIN: https://labstar.pages.dev
      PREVIEW_ORIGIN: https://preview-ci.labstar.pages.dev
      TAURI_ORIGIN: http://tauri.localhost
      UNTRUSTED_ORIGIN: http://example.com

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restaurar cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Verificar formatação
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      - name: Executar Clippy sem avisos
        run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - name: Executar testes
        run: cargo test --locked --manifest-path backend/Cargo.toml

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validar credencial de publicação
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "O secret FLY_API_TOKEN não está configurado no environment production."
            exit 1
          fi

      - name: Publicar contêiner Rust
        run: >-
          flyctl deploy
          --app labstar-api-mackson
          --config backend/fly.toml
          --dockerfile backend/Dockerfile
          --remote-only
          --ha=false
          --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Confirmar saúde e endpoint protegido
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 60 \
            "$API_URL/health/live" | tee live.json
          grep -q '"status":"ok"' live.json
          grep -q '"service":"labstar-admin-api"' live.json

          status="$(curl --silent --show-error \
            --output unauthorized.json --write-out '%{http_code}' \
            --request DELETE \
            --header 'content-type: application/json' \
            --data '{"email":"nobody@example.invalid"}' \
            "$API_URL/v1/admin/accounts")"
          test "$status" = "401"
          grep -q '"code":"authentication_failed"' unauthorized.json

      - name: Confirmar CORS das origens oficiais
        shell: bash
        run: |
          set -euo pipefail
          for origin in "$WEB_ORIGIN" "$PREVIEW_ORIGIN" "$TAURI_ORIGIN"; do
            headers="$(mktemp)"
            curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 20 --max-time 60 \
              --dump-header "$headers" --output /dev/null \
              --request OPTIONS \
              --header "Origin: $origin" \
              --header 'Access-Control-Request-Method: DELETE' \
              --header 'Access-Control-Request-Headers: authorization,content-type' \
              "$API_URL/v1/admin/accounts"
            tr -d '\r' < "$headers" > "$headers.normalized"
            grep -Fiq "access-control-allow-origin: $origin" "$headers.normalized"
            grep -Eiq '^access-control-allow-methods:.*DELETE' "$headers.normalized"
            grep -Eiq '^access-control-allow-headers:.*authorization' "$headers.normalized"
          done

      - name: Confirmar bloqueio de origem não confiável
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --connect-timeout 20 --max-time 60 \
            --dump-header untrusted-headers.txt --output /dev/null \
            --request OPTIONS \
            --header "Origin: $UNTRUSTED_ORIGIN" \
            --header 'Access-Control-Request-Method: DELETE' \
            --header 'Access-Control-Request-Headers: authorization,content-type' \
            "$API_URL/v1/admin/accounts"
          tr -d '\r' < untrusted-headers.txt > untrusted-headers-normalized.txt
          if grep -Fiq "access-control-allow-origin: $UNTRUSTED_ORIGIN" untrusted-headers-normalized.txt; then
            echo "A API autorizou uma origem HTTP remota não confiável."
            exit 1
          fi

      - name: Diagnosticar estado da Fly.io
        if: always()
        shell: bash
        run: |
          flyctl status --app labstar-api-mackson --all || true
          flyctl checks list --app labstar-api-mackson || true
          flyctl logs --app labstar-api-mackson --no-tail || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
