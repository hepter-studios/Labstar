name: Publicar backend Rust na Fly.io

on:
  push:
    branches:
      - "feat/rust-backend-clean"
    paths:
      - "backend/**"
      - ".github/workflows/deploy-rust-backend-fly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rust-backend-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validar e publicar API Rust
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Rust estável
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verificar formatação
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Executar Clippy sem avisos
        run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Executar testes
        run: cargo test --locked --manifest-path backend/Cargo.toml --all-features

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Publicar contêiner Rust
        run: >-
          flyctl deploy
          --app labstar-api-mackson
          --config backend/fly.toml
          --dockerfile backend/Dockerfile
          --remote-only
          --ha=false
          --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Diagnosticar estado da Fly.io
        if: always()
        shell: bash
        run: |
          echo "=== STATUS ==="
          flyctl status --app labstar-api-mackson --all || true
          echo "=== HEALTH CHECKS ==="
          flyctl checks list --app labstar-api-mackson || true
          echo "=== LOGS RECENTES ==="
          flyctl logs --app labstar-api-mackson --no-tail || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
