[package]
name = "labstar"
version = "11.0.1"
description = "Ambiente privado para empresas, projetos e equipes."
authors = ["Labstar"]
license = "Proprietary"
repository = "https://github.com/macksonvictor/Labstar"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "labstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5" }
tauri-plugin-log = "2"
