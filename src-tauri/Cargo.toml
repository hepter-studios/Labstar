[package]
name = "labstar"
version = "11.2.9"
description = "Labstar desktop and mobile application"
authors = ["Hepter Studios"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "labstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
log = "0.4.28"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-log = "2.8.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.3"
tauri-plugin-stronghold = "2"
url = "2.5.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }

[profile.dev.package.scrypt]
opt-level = 3
