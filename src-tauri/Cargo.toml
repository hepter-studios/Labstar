[package]
name = "labstar"
version = "11.0.0"
description = "Aplicativo desktop profissional da Labstar"
authors = ["Labstar"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "labstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
