app = "labstar-api-mackson"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  LABSTAR_BIND_ADDR = "0.0.0.0:8080"
  LABSTAR_ALLOWED_ORIGINS = "https://labstar.pages.dev,http://tauri.localhost,https://tauri.localhost,tauri://localhost"
  LABSTAR_REQUEST_TIMEOUT_SECONDS = "30"
  LABSTAR_DATABASE_MAX_CONNECTIONS = "10"
  RUST_LOG = "labstar_backend=info,tower_http=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health/live"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
