# fly.toml app configuration file generated for labstar-api-mackson on 2026-07-30T22:53:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'labstar-api-mackson'
primary_region = 'gru'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  LABSTAR_ALLOWED_ORIGINS = 'https://labstar.pages.dev'
  LABSTAR_BIND_ADDR = '0.0.0.0:8080'
  LABSTAR_DATABASE_MAX_CONNECTIONS = '10'
  LABSTAR_REQUEST_TIMEOUT_SECONDS = '15'
  RUST_LOG = 'labstar_backend=info,tower_http=info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health/live'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
